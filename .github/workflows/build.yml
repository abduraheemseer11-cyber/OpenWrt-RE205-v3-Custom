name: Build OpenWrt - TP-Link RE205 v3 Custom

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt 24.10.x version, or latest'
        required: false
        default: 'latest'
      profile:
        description: 'ImageBuilder profile'
        required: false
        default: 'tplink_re205-v3'

env:
  TARGET_PATH: ramips/mt76x8
  SERIES: "24.10"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git \
            gettext libssl-dev xsltproc rsync wget unzip python3 zstd file

      - name: Validate and prepare custom theme
        run: |
          set -euo pipefail
          chmod +x files/etc/uci-defaults/99-custom-settings scripts/patch_theme.py
          python3 scripts/patch_theme.py --root files --logo assets/logo-original.png
          bash -n files/etc/uci-defaults/99-custom-settings

      - name: Resolve OpenWrt version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          V="${INPUT_VERSION:-latest}"
          if [ "$V" = "latest" ]; then
            V="$(curl -fsSL https://downloads.openwrt.org/releases/ \
              | grep -oE '24\.10\.[0-9]+/' | tr -d '/' | sort -Vu | tail -n1)"
          fi
          [[ "$V" =~ ^24\.10\.[0-9]+$ ]] || { echo "::error::Invalid OpenWrt version: $V"; exit 1; }
          echo "Resolved OpenWrt version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Download and verify ImageBuilder
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          BASE="https://downloads.openwrt.org/releases/${V}/targets/${TARGET_PATH}"
          FILE="openwrt-imagebuilder-${V}-ramips-mt76x8.Linux-x86_64.tar.zst"
          # Download both files with redirects/retries and reject empty responses.
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --output "${FILE}" "${BASE}/${FILE}"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            --output sha256sums "${BASE}/sha256sums"

          [[ -s "${FILE}" ]] || { echo "::error::ImageBuilder download is empty"; exit 1; }
          [[ -s sha256sums ]] || { echo "::error::sha256sums download is empty"; exit 1; }

          # Extract the checksum by exact filename. OpenWrt checksum entries may
          # use either two spaces or the binary-file '*' marker.
          EXPECTED="$(awk -v wanted="${FILE}" '
            NF >= 2 {
              name = $2
              sub(/^\*/, "", name)
              sub(/^.*\//, "", name)
              if (name == wanted && $1 ~ /^[[:xdigit:]][[:xdigit:]]*$/ && length($1) == 64) {
                print tolower($1)
                exit
              }
            }
          ' sha256sums)"

          if [[ ! "${EXPECTED}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::No valid SHA-256 entry found for ${FILE} in ${BASE}/sha256sums"
            echo "Available ImageBuilder checksum entries:"
            grep -F 'openwrt-imagebuilder-' sha256sums | head -n 20 || true
            echo "Checksum file preview:"
            head -n 5 sha256sums || true
            exit 1
          fi

          printf '%s  %s\n' "${EXPECTED}" "${FILE}" | sha256sum --check --status - || {
            echo "::error::SHA-256 verification failed for ${FILE}"
            exit 1
          }
          echo "ImageBuilder SHA-256 verified: ${EXPECTED}"

          tar --zstd -tf "${FILE}" >/dev/null
          tar --zstd -xf "${FILE}"
          mv "${FILE%.tar.zst}" imagebuilder

      - name: Build firmware
        env:
          INPUT_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          PROFILE="${INPUT_PROFILE:-tplink_re205-v3}"
          cd imagebuilder
          INFO="$(make info)"
          if ! grep -q "^${PROFILE}:" <<< "$INFO"; then
            echo "::error::Profile '${PROFILE}' not found. Available TP-Link profiles:"
            grep -E '^(tplink|tp-link)' <<< "$INFO" || true
            exit 1
          fi
          PACKAGES="$(grep -vE '^[[:space:]]*(#|$)' ../packages.txt | tr '\n' ' ')"
          make image PROFILE="${PROFILE}" PACKAGES="${PACKAGES}" \
            FILES="${GITHUB_WORKSPACE}/files" EXTRA_IMAGE_NAME="almakhdhi"

      - name: Collect output
        run: |
          set -euo pipefail
          mkdir -p out
          cd imagebuilder/bin/targets/ramips/mt76x8
          cp -v *sysupgrade*.bin ../../../../../out/
          cp -v *factory*.bin ../../../../../out/ || echo "::warning::No factory image produced"
          cp -v sha256sums *.manifest ../../../../../out/ 2>/dev/null || true
          ls -lh ../../../../../out/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-re205-v3-custom-${{ steps.ver.outputs.version }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
