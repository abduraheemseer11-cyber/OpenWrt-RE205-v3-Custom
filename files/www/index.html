<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>WrtMax</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="/assets/logo.png" alt="WrtMax Firmware Solutions">
    <div class="tools">
      <button type="button" id="lang-toggle" class="ghost">العربية</button>
      <input id="pin" type="password" placeholder="PIN" autocomplete="off" aria-label="PIN">
    </div>
  </header>

  <nav class="tabs">
    <button type="button" data-tab="dashboard" class="active" data-i18n="dashboard">Dashboard</button>
    <button type="button" data-tab="mode" data-i18n="mode">Quick Mode</button>
    <button type="button" data-tab="analyzer" data-i18n="analyzer">Wi-Fi Analyzer</button>
    <button type="button" data-tab="clients" data-i18n="clients">Clients</button>
    <button type="button" data-tab="settings" data-i18n="settings">Settings</button>
  </nav>

  <main>
    <p id="notice" class="notice" hidden></p>

    <section id="tab-dashboard" class="panel active">
      <p id="s-info" class="muted">–</p>
      <div class="grid">
        <div class="card"><h3 data-i18n="uptime">Uptime</h3><p id="s-uptime">–</p></div>
        <div class="card"><h3 data-i18n="memory">Memory used</h3><p id="s-mem">–</p></div>
        <div class="card"><h3 data-i18n="temp">Temperature</h3><p id="s-temp">–</p></div>
        <div class="card"><h3 data-i18n="traffic">Traffic in / out</h3><p id="s-traffic">–</p></div>
        <div class="card"><h3 data-i18n="eth">Ethernet port</h3><p id="s-eth">–</p></div>
        <div class="card"><h3 data-i18n="clients24">Clients 2.4 GHz</h3><p id="s-c2">–</p></div>
        <div class="card"><h3 data-i18n="clients5">Clients 5 GHz</h3><p id="s-c5">–</p></div>
      </div>
      <div id="warnings"></div>
    </section>

    <section id="tab-mode" class="panel">
      <form id="mode-form" class="card">
        <label><input type="radio" name="mode" value="ap" checked> <span data-i18n="modeAp">Access point (wired)</span></label>
        <label><input type="radio" name="mode" value="wds"> <span data-i18n="modeWds">Range extender (WDS)</span></label>
        <label><input type="radio" name="mode" value="wisp"> <span data-i18n="modeWisp">WISP / repeater</span></label>
        <div id="parent-fields" hidden>
          <label><span data-i18n="parentSsid">Parent network name</span><input name="ssid" maxlength="32"></label>
          <label><span data-i18n="parentKey">Parent password</span><input name="key" type="password" maxlength="63"></label>
        </div>
        <button type="submit" data-i18n="apply">Apply</button>
      </form>
    </section>

    <section id="tab-analyzer" class="panel">
      <div class="row">
        <button type="button" id="scan-btn" data-i18n="scan">Scan</button>
        <button type="button" id="auto-btn" data-i18n="autochannel">Auto-select channel</button>
      </div>
      <div id="scan-out" class="card"></div>
    </section>

    <section id="tab-clients" class="panel">
      <div class="card table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="name">Name</th>
              <th data-i18n="mac">MAC address</th>
              <th data-i18n="ip">IP</th>
              <th data-i18n="signal">Signal</th>
              <th data-i18n="rate">Rate</th>
              <th data-i18n="action">Action</th>
            </tr>
          </thead>
          <tbody id="clients-body"></tbody>
        </table>
      </div>
    </section>

    <section id="tab-settings" class="panel">
      <form id="tx-form" class="card">
        <h3 data-i18n="txpower">TX power</h3>
        <label><span data-i18n="radio">Radio</span>
          <select name="radio"><option value="0">2.4 GHz</option><option value="1">5 GHz</option></select>
        </label>
        <label><span data-i18n="dbm">dBm (5–20)</span><input name="dbm" type="number" min="5" max="20" value="17"></label>
        <button type="submit" data-i18n="save">Save</button>
      </form>

      <form id="wd-form" class="card">
        <h3 data-i18n="watchdog">Watchdog</h3>
        <label class="inline"><input type="checkbox" name="enabled"> <span data-i18n="enabled">Enabled</span></label>
        <label><span data-i18n="rebootAt">Daily reboot (HH:MM, empty = off)</span><input name="reboot_time" placeholder="04:00" maxlength="5"></label>
        <button type="submit" data-i18n="save">Save</button>
      </form>

      <form id="block-form" class="card">
        <h3 data-i18n="blockTitle">Block or unblock a device</h3>
        <label><span data-i18n="mac">MAC address</span><input name="mac" placeholder="AA:BB:CC:DD:EE:FF" maxlength="17"></label>
        <div class="row">
          <button type="submit" name="op" value="block" data-i18n="block">Block</button>
          <button type="submit" name="op" value="unblock" class="ghost" data-i18n="unblock">Unblock</button>
        </div>
      </form>

      <form id="pin-form" class="card">
        <h3 data-i18n="changePin">Change PIN</h3>
        <label><span data-i18n="newPin">New PIN (6–16 letters or digits)</span><input name="newpin" maxlength="16"></label>
        <button type="submit" data-i18n="save">Save</button>
      </form>

      <div class="card">
        <h3 data-i18n="maintenance">Maintenance</h3>
        <button type="button" id="backup-btn" data-i18n="backup">Download backup</button>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span data-i18n="support">Technical support</span>
    <a id="support" href="tel:776538297">776 538 297</a>
  </footer>

  <script src="/assets/app.js"></script>
</body>
</html>
